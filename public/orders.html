<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ruchiram • Orders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header small">
    <div class="brand">Ruchiram • Orders</div>
    <nav class="top-actions">
      <a class="ghost" href="index.html">Home</a>
      <button id="ordersNew" class="btn">+ New</button>
    </nav>
  </header>

  <div class="dashboard">
    <aside class="sidebar card">
      <div class="side-title">Sections</div>
      <ul class="side-list">
        <li><button class="sectionBtn" data-section="A">A · DESERTS</button></li>
        <li><button class="sectionBtn" data-section="B">B · BIRIYANI</button></li>
        <li><button class="sectionBtn" data-section="C">C · ICE CREAM</button></li>
        <li><button class="sectionBtn" data-section="D">D · SODA</button></li>
        <li><button class="sectionBtn" data-section="E">E · BWONIE</button></li>
      </ul>
      <div class="side-actions">
        <button id="allOrdersBtn" class="btn outline">All Orders</button>
        <button id="deliveredBtn" class="btn ghost">Delivered</button>
      </div>
      <div class="side-note muted">Orders saved locally on server (orders.json). For multi-user, use DB + auth.</div>
    </aside>

    <main class="content">
      <div class="content-head card">
        <h3 id="panelTitle">All Orders</h3>
        <div class="muted" id="summary">—</div>
      </div>

      <div id="ordersList" class="orders-grid"></div>
    </main>
  </div>

  <!-- Reuse modal markup -->
  <div id="orderModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeModal">&times;</button>
      <h3>New Order</h3>
      <form id="orderForm">
        <label class="field"><span>Customer Name</span><input name="name" placeholder="e.g. Abdul" required /></label>
        <label class="field"><span>Product</span>
          <select name="productName" id="productSelect" required></select>
        </label>
        <label class="field"><span>Price</span><input name="price" type="number" step="0.01" placeholder="₹" required /></label>
        <div class="two-cols">
          <label class="field"><span>Paid</span>
            <select name="paid">
              <option value="no">No</option>
              <option value="yes">Yes</option>
            </select>
          </label>
          <label class="field"><span>Section</span>
            <select name="section" id="sectionSelect" required>
              <option value="A">A - DESERTS</option>
              <option value="B">B - BIRIYANI</option>
              <option value="C">C - ICE CREAM</option>
              <option value="D">D - SODA</option>
              <option value="E">E - BWONIE</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save Order</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
