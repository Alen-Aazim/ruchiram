<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ruchiram • Food Festival</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">Ruchiram</div>
    <nav class="top-actions">
      <a class="ghost" href="orders.html">Orders Dashboard</a>
      <button id="menuDot" class="icon-dot" aria-label="menu">•••</button>
      <div id="dotMenu" class="menu-pop hidden" role="menu">
        <button data-action="A">DESERTS - A</button>
        <button data-action="B">BIRIYANI - B</button>
        <button data-action="C">ICE CREAM - C</button>
        <button data-action="D">SODA - D</button>
        <button data-action="E">BWONIE - E</button>
        <hr/>
        <button id="viewDelivered">DELIVERED ORDERS</button>
        <button id="viewAll">ALL ORDERS</button>
        <button id="newOrderBtnTop">NEW ORDER</button>
      </div>
    </nav>
  </header>

  <main class="main">
    <section class="hero card">
      <div class="hero-left">
        <h1>Ruchiram Food Festival</h1>
        <p class="muted">Fast & organized ordering for festival counters. Add orders, view by section, mark delivered. Clean UI — mobile friendly.</p>
        <div class="cta-row">
          <a class="btn" href="orders.html">Open Orders</a>
          <button class="btn outline" id="openNew">+ New Order</button>
        </div>
      </div>
      <div class="hero-right">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='240'><rect width='100%' height='100%' fill='%23071a2b'/></svg>" alt="" />
      </div>
    </section>

    <section class="card products-section">
      <div class="section-head">
        <h2>Menu — Popular</h2>
        <div class="muted">Tap any item to start quick order</div>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- Floating new order button -->
  <button id="fab" class="fab" title="New Order">＋</button>

  <!-- Order Modal -->
  <div id="orderModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeModal">&times;</button>
      <h3>New Order</h3>
      <form id="orderForm">
        <label class="field"><span>Customer Name</span><input name="name" placeholder="e.g. Abdul" required /></label>
        <label class="field"><span>Product</span>
          <select name="productName" id="productSelect" required></select>
        </label>
        <label class="field"><span>Price</span><input name="price" type="number" step="0.01" placeholder="₹" required /></label>
        <div class="two-cols">
          <label class="field"><span>Paid</span>
            <select name="paid">
              <option value="no">No</option>
              <option value="yes">Yes</option>
            </select>
          </label>
          <label class="field"><span>Section</span>
            <select name="section" id="sectionSelect" required>
              <option value="A">A - DESERTS</option>
              <option value="B">B - BIRIYANI</option>
              <option value="C">C - ICE CREAM</option>
              <option value="D">D - SODA</option>
              <option value="E">E - BWONIE</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save Order</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
