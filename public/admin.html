<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Ruchiram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">R</div>
        <div class="brand-text">
          <div class="site-title">Admin — Ruchiram</div>
          <div class="site-sub">Add products (private or public)</div>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn ghost" href="/">Home</a>
      </div>
    </div>
  </header>

  <main class="container content">
    <section class="card">
      <h3>Authenticate</h3>
      <label class="label">Admin token</label>
      <input id="token" class="input" type="password" placeholder="Paste your ADMIN_TOKEN here">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button id="btnLogin" class="btn primary">Login</button>
        <button id="btnFetchPublic" class="btn ghost">View public products</button>
      </div>
    </section>

    <section class="card" id="adminArea" style="display:none">
      <h3>Add product</h3>
      <div class="field"><label class="label">Product name</label><input id="prodName" class="input"></div>
      <div class="field"><label class="label">Section</label>
        <select id="prodSection" class="input">
          <option>BIRIYANI</option><option>SODA</option><option>UPPILITTATHU</option><option>POPCORN</option><option>ICE CREAM</option>
        </select>
      </div>
      <div class="field"><label class="label">Price</label><input id="prodPrice" class="input" type="number" min="0"></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
        <label><input id="prodPrivate" type="checkbox"> Private (only visible to admin)</label>
        <button id="btnAddProd" class="btn primary">Add</button>
      </div>
    </section>

    <section class="card">
      <h3>Products</h3>
      <div id="allProducts" class="product-list">No products loaded.</div>
    </section>
  </main>

  <footer class="site-footer"><div class="container small">Admin area — keep your token secret</div></footer>

  <script src="/admin.js" defer></script>
</body>
</html>
