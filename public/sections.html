<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Section — Ruchiram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">R</div>
        <div class="brand-text">
          <div class="site-title">Ruchiram</div>
          <div class="site-sub" id="subtitle">Section</div>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn ghost" href="/">Home</a>
      </div>
    </div>
  </header>

  <main class="container content">
    <h2 id="title">Section</h2>
    <p class="muted" id="desc">Loading products...</p>

    <div id="grid" class="grid"></div>
    <div id="no" class="muted" style="display:none">No public products in this section.</div>
  </main>

  <footer class="site-footer">
    <div class="container">© Ruchiram</div>
  </footer>

<script>
(async function(){
  function qs(k){ return new URLSearchParams(location.search).get(k); }
  const section = qs('section') || 'ALL';
  document.getElementById('subtitle').textContent = section;
  document.getElementById('title').textContent = section;

  async function fetchProducts() {
    const url = '/api/products' + (section && section !== 'ALL' ? '?section=' + encodeURIComponent(section) : '');
    const res = await fetch(url);
    return res.ok ? (await res.json()).products || [] : [];
  }

  function render(items) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (!items.length) {
      document.getElementById('no').style.display = '';
      return;
    }
    document.getElementById('no').style.display = 'none';
    items.forEach(p => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<h3>${escapeHtml(p.product)}</h3><div class="muted">${escapeHtml(p.section)}</div><div style="margin-top:10px"><strong>₹${p.price||0}</strong></div><div style="margin-top:10px"><button class="btn primary orderBtn">Order</button></div>`;
      el.querySelector('.orderBtn').addEventListener('click', ()=>openOrderPrompt(p));
      grid.appendChild(el);
    });
  }

  function openOrderPrompt(p) {
    const name = prompt('Buyer name?') || 'Guest';
    const price = prompt('Price (₹)', p.price || 0) || p.price || 0;
    const paid = confirm('Mark as paid?') ? 'yes' : 'no';
    // store in localStorage 'ruchiram_orders'
    const key = 'ruchiram_orders';
    const arr = JSON.parse(localStorage.getItem(key)||'[]');
    arr.push({ id: 'o_' + Date.now(), name, product: p.product, price: Number(price), paid, section: p.section, delivered:false, createdAt: Date.now() });
    localStorage.setItem(key, JSON.stringify(arr));
    alert('Order saved locally. Staff can view delivered/all orders on the staff page.');
  }

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const products = await fetchProducts();
  render(products);
})();
</script>
</body>
</html>
